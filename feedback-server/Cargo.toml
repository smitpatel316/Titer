[package]
name = "titer-feedback"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "First-party feedback endpoint for Titer: validates feedback reports and files them as Plane issues. Stateless apart from a bounded in-memory dedupe set, never stores or logs feedback text."

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
# rustls, not OpenSSL: no system TLS dependency on any target (same choice as src-tauri and the broker).
# gzip: Plane answers `Accept-Encoding: gzip` with a gzipped body, and
# without this feature reqwest cannot decode it (the create call then
# fails its JSON parse and maps to 502 — found by the live smoke test).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
strip = true

[dev-dependencies]
# Only tests use it (oneshot requests against the router).
tower = { version = "0.5", features = ["util"] }
